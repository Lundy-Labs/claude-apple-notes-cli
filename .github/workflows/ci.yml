name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: lint + convert tests (Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable, with dev tools)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # convert.py is pure Python and runs anywhere. Backend/CLI/MCP code that
        # talks to Notes needs macOS and is exercised manually there — not in CI.
        run: pytest -q
