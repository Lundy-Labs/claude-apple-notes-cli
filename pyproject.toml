[project]
name = "claude-apple-notes-cli"
version = "0.1.0"
description = "Read/write Apple Notes from the terminal and from Claude (MCP), communicating in Markdown."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",          # CLI
    "mcp>=1.2",             # MCP server (stdio + HTTP)
    "markdownify>=0.13",    # HTML -> Markdown
    "markdown>=3.6",        # Markdown -> HTML
    "beautifulsoup4>=4.12",  # HTML normalization for Notes-flavored HTML
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
notes = "apple_notes.cli:app"
apple-notes-mcp = "apple_notes.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_notes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing style in files this PR does not restyle.
"src/apple_notes/convert.py" = ["UP031", "SIM103"]
"src/apple_notes/export.py" = ["DTZ011"]
"src/apple_notes/backend.py" = ["FURB188"]
"tests/test_convert.py" = ["I001"]
